# =============================================================================
# Caetutti Dynamics - Docker Compose para Oracle Cloud Free Tier
# Servicios: backend, frontend, nginx, cloudflared (opcional)
# =============================================================================
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Backend: Express + Playwright + SQLite + Sync Worker
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: caetutti-backend
    restart: unless-stopped
    user: "appuser"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_FILE=/data/caetutti.db
      # Playwright config
      - PLAYWRIGHT_BROWSERS_PATH=0
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - HEADLESS=true
    volumes:
      - caetutti-data:/data
      - ./backend/src:/app/backend/dist/src:ro  # hot-reload en dev (opcional)
    networks:
      - caetutti-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Frontend: Next.js standalone server
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: caetutti-frontend
    restart: unless-stopped
    user: "appuser"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    command: ["node", "frontend/server.js"]
    networks:
      - caetutti-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Nginx: Reverse proxy, SSL termination, static caching, gzip
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: caetutti-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - caetutti-frontend-static:/app/frontend/.next/static:ro
    networks:
      - caetutti-net
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Cloudflared Tunnel (opcional) - DNS + HTTPS gratis sin IP fija
  # Descomenta y configura TUNNEL_TOKEN para activar
  # ---------------------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: caetutti-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   networks:
  #     - caetutti-net
  #   depends_on:
  #     - nginx
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 64M

  # ---------------------------------------------------------------------------
  # Certbot para Let's Encrypt (renovación automática via cron en host)
  # ---------------------------------------------------------------------------
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: caetutti-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

networks:
  caetutti-net:
    driver: bridge
    name: caetutti-network

volumes:
  caetutti-data:
    driver: local
    name: caetutti-data
  caetutti-frontend-static:
    driver: local
    name: caetutti-frontend-static