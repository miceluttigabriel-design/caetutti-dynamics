# =============================================================================
# Caetutti Dynamics - Nginx Configuration
# Reverse proxy para Next.js (frontend) + Express (backend API)
# SSL via Let's Encrypt / Cloudflare Tunnel
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm;

    # Brotli (requiere módulo ngx_brotli, opcional)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstreams
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:4000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --------------------------
    # HTTP -> HTTPS redirect (si usas Let's Encrypt directo)
    # --------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge para Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Healthcheck sin redirect
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Redirect todo lo demás a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------
    # HTTPS Server (principal)
    # --------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/caetutti.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/caetutti.com/privkey.pem;
        # ssl_trusted_certificate /etc/letsencrypt/live/caetutti.com/chain.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS (descomenta tras verificar HTTPS funciona)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # CSP para Next.js (ajusta si usas inline scripts/styles)
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://d39ru7awumhhs2.cloudfront.net;
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: https: blob:;
            font-src 'self' data:;
            connect-src 'self' https://api-v2.dropi.com.py https://api.dropi.com.py;
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
        " always;

        # --------------------------
        # Static Assets (Next.js) - Cache agresivo
        # --------------------------
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /_next/image/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public folder
        location /public/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Favicon, robots, sitemap
        location = /favicon.ico {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /robots.txt {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /sitemap.xml {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        # --------------------------
        # API Routes -> Backend
        # --------------------------
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            # Headers extra para API
            proxy_set_header X-API-Request "true";

            # Login endpoint - rate limit estricto
            location = /api/admin/login {
                limit_req zone=login burst=3 nodelay;
                proxy_pass http://backend;
            }

            # Webhooks / callbacks sin rate limit estricto
            location ~ ^/api/(webhook|callback|dropi)/ {
                limit_req zone=api burst=100 nodelay;
                proxy_pass http://backend;
            }

            proxy_pass http://backend;
        }

        # --------------------------
        # Healthchecks
        # --------------------------
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/health {
            access_log off;
            proxy_pass http://backend;
        }

        # --------------------------
        # Todo lo demás -> Frontend (Next.js)
        # --------------------------
        location / {
            proxy_pass http://frontend;

            # Cache para páginas estáticas (opcional, Next.js maneja su cache)
            # proxy_cache_valid 200 1h;
            # add_header X-Cache-Status $upstream_cache_status;

            # Pass request headers
            proxy_set_header X-Request-ID $request_id;
        }
    }

    # --------------------------
    # Server block para Cloudflare Tunnel (puerto 8080 interno)
    # Si usas cloudflared, este block recibe tráfico ya descifrado
    # --------------------------
    # server {
    #     listen 8080;
    #     server_name _;
    #
    #     # Mismos location blocks que arriba pero SIN SSL
    #     # ...
    # }