# =============================================================================
# Caetutti Dynamics - Nginx Config para Home Server + Cloudflare Tunnel
# Cloudflare termina SSL → Nginx recebe HTTP na porta 80
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm;

    # Real IP from Cloudflare (CF-Connecting-IP header)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Upstreams
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:4000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --------------------------
    # HTTP Server (Cloudflare Tunnel conecta aqui)
    # Cloudflare já termina HTTPS → nós recebemos HTTP simples
    # --------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck para Cloudflare/Watchtower
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # --------------------------
        # Static Assets (Next.js) - Cache agressivo
        # --------------------------
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /_next/image/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public folder
        location /public/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Favicon, robots, sitemap
        location = /favicon.ico {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /robots.txt {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /sitemap.xml {
            proxy_pass http://frontend;
            access_log off;
            add_header Cache-Control "public, max-age=86400";
        }

        # --------------------------
        # API Routes -> Backend
        # --------------------------
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            # Headers extra para API
            proxy_set_header X-API-Request "true";

            # Login endpoint - rate limit estricto
            location = /api/admin/login {
                limit_req zone=login burst=3 nodelay;
                proxy_pass http://backend;
            }

            # Webhooks / callbacks sem rate limit estricto
            location ~ ^/api/(webhook|callback|dropi)/ {
                limit_req zone=api burst=100 nodelay;
                proxy_pass http://backend;
            }

            proxy_pass http://backend;
        }

        # --------------------------
        # Todo o resto -> Frontend (Next.js)
        # --------------------------
        location / {
            proxy_pass http://frontend;

            # Pass request headers
            proxy_set_header X-Request-ID $request_id;
        }
    }
}